<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace Analysis Visualization</title>
    <script src="https://d3js.org/d3.v5.min.js"></script>
    <style>
        div {
            margin-bottom: 5pt;
        }
        #instruction {
            text-align: left;
            font-size: small;
            font-family: 'Arial', sans-serif; /* Set font-family to sans-serif */
        }
        #title {
            text-align: left;
            font-weight: bold;
            font-size: small;
            font-family: 'Arial', sans-serif; /* Set font-family to sans-serif */
            margin-bottom: 2pt;
        }
        #footer {
            text-align: left;
            font-size: xx-small;
            font-family: 'Arial', sans-serif; /* Set font-family to sans-serif */
        }
        #box {
            border: 1px solid #ccc; /* Add a border around the box */
            padding: 10px; /* Add some padding for better visualization */
        }
        #box > div:first-child {
            text-align: left;
            font-weight: bold;
            font-family: 'Arial', sans-serif; /* Set font-family to sans-serif */
        }
        #boundary-display {
            font-size: x-small;
            font-family: 'Arial', sans-serif; /* Set font-family to sans-serif */
        }
        rect.range:hover {
            fill: blue;
        }
        .usage-box { border: 1px solid #ccc; padding: 10px; margin-top: 16px; font-family: Arial, sans-serif; }
        .usage-box h2 { font-size: 1rem; }
        details { margin: 8px 0 8px 16px; }
        summary { cursor: pointer; }
        .matrix-scroll { overflow-x: auto; }
        table { border-collapse: collapse; }
        caption { text-align: left; margin-bottom: 8px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: right; }
        th:first-child { text-align: left; }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/nouislider/distribute/nouislider.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/nouislider/distribute/nouislider.min.js"></script>
</head>
<body>

<div id="tooltip" style="position: absolute; visibility: hidden; background-color: lightgrey; color: black; padding: 5px; border-radius: 5px; font-size: small; font-family: Arial, sans-serif;"></div>
<div id="instruction">Opened through BC Dev Toolset visualization command.</div>
<div id="title">Workspace Analysis Visualization</div>
<div id="box">
    <div id="box_caption">Range Pool Usage</div>
    <div id="boundary-display" style="text-align: center; margin-bottom: 10px;">Range: <span id="boundary-start">0</span> - <span id="boundary-end">100</span></div>
    <div id="visualization"></div>
    <div id="slider-container"></div>
</div>
<section class="usage-box" aria-labelledby="usage-title">
    <h2 id="usage-title">Actual Object ID Usage</h2>
    <p>Unique IDs per app and object type from workspace AL source. Conditional compilation branches are included; dependencies are excluded.</p>
    <div id="usage-tree"></div>
</section>
<section class="usage-box" aria-labelledby="matrix-title">
    <h2 id="matrix-title">Object Counts</h2>
    <div id="usage-matrix" class="matrix-scroll"></div>
</section>
<script>
    function contiguousRanges(ids) {
        const ranges = [];
        for (const id of [...new Set(ids)].sort((a, b) => a - b)) {
            const last = ranges[ranges.length - 1];
            if (last && id === last.to + 1) last.to = id;
            else ranges.push({ from: id, to: id });
        }
        return ranges;
    }

    function renderObjectUsage(data) {
        const tree = document.getElementById('usage-tree');
        const matrix = document.getElementById('usage-matrix');
        tree.replaceChildren();
        matrix.replaceChildren();
        if (!Array.isArray(data.object_usage)) {
            tree.textContent = 'Run Prepare object id range data for visualization to collect actual object usage.';
            matrix.textContent = 'Object usage data has not been collected.';
            return;
        }
        const append = (parent, tag, text) => {
            const element = document.createElement(tag);
            if (text !== undefined) element.textContent = text;
            parent.appendChild(element);
            return element;
        };
        const apps = data.object_usage.map(app => {
            const groups = new Map();
            for (const object of app.objects || []) {
                if (!groups.has(object.type)) groups.set(object.type, new Set());
                groups.get(object.type).add(object.id);
            }
            return { ...app, groups, total: [...groups.values()].reduce((sum, ids) => sum + ids.size, 0) };
        }).sort((a, b) => a.name.localeCompare(b.name) || a.path.localeCompare(b.path));
        const types = [...new Set(apps.flatMap(app => [...app.groups.keys()]))].sort();
        if (!apps.length) tree.textContent = 'No apps found in the workspace.';
        for (const app of apps) {
            const branch = append(tree, 'details');
            append(branch, 'summary', `${app.name} (${app.total})`);
            append(branch, 'p', `${app.path} · ${app.app_id}`);
            if (!app.total) append(branch, 'p', 'No numbered AL objects found.');
            for (const type of [...app.groups.keys()].sort()) {
                const ids = app.groups.get(type);
                const typeBranch = append(branch, 'details');
                append(typeBranch, 'summary', `${type} (${ids.size})`);
                const list = append(typeBranch, 'ul');
                for (const range of contiguousRanges([...ids])) {
                    append(list, 'li', range.from === range.to ? `${range.from}` : `${range.from}–${range.to}`);
                }
            }
        }
        const table = append(matrix, 'table');
        append(table, 'caption', 'Unique object IDs by app and object type');
        const header = append(append(table, 'thead'), 'tr');
        for (const label of ['App', ...types, 'Total']) append(header, 'th', label).scope = 'col';
        const body = append(table, 'tbody');
        for (const app of apps) {
            const row = append(body, 'tr');
            const label = append(row, 'th', `${app.name} (${app.path})`);
            label.scope = 'row';
            label.title = app.app_id;
            for (const type of types) append(row, 'td', app.groups.get(type)?.size || 0);
            append(row, 'td', app.total);
        }
        const totals = append(append(table, 'tfoot'), 'tr');
        append(totals, 'th', 'Total').scope = 'row';
        for (const type of types) append(totals, 'td', apps.reduce((sum, app) => sum + (app.groups.get(type)?.size || 0), 0));
        append(totals, 'td', apps.reduce((sum, app) => sum + app.total, 0));
    }
    
    let globalData;
    let poolRange;

    const dataFileParam = new URLSearchParams(window.location.search).get('data');
    const dataFile = dataFileParam || './data.json';
    const dataPromise = window.bcDevToolsetData
        ? Promise.resolve(window.bcDevToolsetData)
        : fetch(dataFile).then(response => response.json());

    // Load JSON data from file using fetch
dataPromise
    .then(data => {
        renderObjectUsage(data);
        // Initialize newPoolRange with the full range from data on page load
        globalData = data;
        poolRange = { ...data.pool_range };
        visualizeRangePool(globalData, poolRange); // Pass newPoolRange to your function
        noUiSlider.create(document.getElementById('slider-container'), {
            start: [0, 100], // Start with handles at the extremes
            connect: true, // Display a colored bar between the handles
            range: {
                'min': 0,
                'max': 100
            }
        });

        // After setting globalData and visualizing for the first time:
        document.getElementById('boundary-start').textContent = poolRange.from;
        document.getElementById('boundary-end').textContent = poolRange.to;

        var slider = document.getElementById('slider-container').noUiSlider;
        slider.on('update', function(values, handle) {
            // values: Array containing the current slider values
            // handle: Index of the handle that caused the event
            var minVal = parseInt(values[0], 10);
            var maxVal = parseInt(values[1], 10);

            // Calculate the new pool range based on slider values
            // Assuming `globalData` is your original data object and `pool_range` is a property in it
            var newPoolRange = {
                from: globalData.pool_range.from + (globalData.pool_range.to - globalData.pool_range.from) * (minVal / 100),
                to: globalData.pool_range.from + (globalData.pool_range.to - globalData.pool_range.from) * (maxVal / 100)
            };

            // Update the boundary display
            document.getElementById('boundary-start').textContent = newPoolRange.from.toFixed(0); // Use toFixed for rounding if necessary
            document.getElementById('boundary-end').textContent = newPoolRange.to.toFixed(0);

            // Redraw your visualization using `newPoolRange` instead of `globalData.pool_range`
            visualizeRangePool(globalData, newPoolRange); // You'll need to modify visualizeRangePool to accept `newPoolRange` as a parameter
        });
    })
    .catch(error => console.error('Error loading JSON:', error));
    function visualizeRangePool(data, newPoolRange) {
        // Compute clipped, normalized positions using inclusive ranges to avoid tiny gaps
        var poolMin = newPoolRange.from;
        var poolMax = newPoolRange.to;
        // Treat IDs as discrete inclusive values; poolCount is used for inclusive width mapping
        var poolCount = (poolMax - poolMin) + 1;

        // Helper to clamp a value
        var clamp = function (val, min, max) { return Math.max(min, Math.min(max, val)); };

        // Build normalized range descriptors only for ranges that intersect the pool
        var normalizedRanges = data.ranges
            .map(function(range) {
                var clippedFrom = Math.max(range.from, poolMin);
                var clippedTo = Math.min(range.to, poolMax);
                if (clippedTo < clippedFrom) {
                    return null; // no intersection
                }

                // Position in percent (0..100). Use inclusive width so back-to-back ranges butt without gaps.
                var xPct = 100 * (clippedFrom - poolMin) / poolCount;
                var wPct = 100 * (clippedTo - clippedFrom + 1) / poolCount;

                // Clamp to stay fully within the pool ribbon
                xPct = clamp(xPct, 0, 100);
                wPct = clamp(wPct, 0, 100 - xPct);

                return {
                    from: range.from,
                    to: range.to,
                    name: range.name,
                    clippedFrom: clippedFrom,
                    clippedTo: clippedTo,
                    xPct: xPct,
                    wPct: wPct
                };
            })
            .filter(function(d) { return d !== null && d.wPct > 0; });

        // Clear existing SVG content
        d3.select("#visualization svg").remove();
        
        // Set up the SVG container
        var svg = d3.select("#visualization")
            .append("svg")
            .attr("width", "100%")
            .attr("height", 50); // Adjust the height as needed

        // Create a base ribbon
        svg.append("rect")
            .attr("x", 0 + "%")
            .attr("y", 0)
            .attr("width", 100 + "%")
            .attr("height", 50) // Adjust the height as needed
            .attr("fill", "lightgreen");

    // Tooltip setup
    var tooltip = d3.select("#tooltip");

    // Add occupied ranges with intensity based on overlap
    svg.selectAll("rect.range")
        .data(normalizedRanges)
        .enter().append("rect")
        .attr("class", "range")
        .attr("x", function(d) { return d.xPct.toFixed(6) + "%"; })
        .attr("y", 0)
        .attr("width", function(d) { return d.wPct.toFixed(6) + "%"; })
        .attr("height", 50) // Adjust the height as needed
        .attr("fill", "red")
        .style("opacity", 0.33) // Adjust the opacity as needed for intensity
        .on("mouseover", function(d) {
            var event = d3.event; // Use d3.event to get the current event in D3 v5
            var label = `${d.name}: ${d.clippedFrom}-${d.clippedTo}`;
            tooltip.style("visibility", "visible")
                   .text(label)
                   .style("top", (event.pageY - 10) + "px")
                   .style("left",(event.pageX + 10) + "px");
        })
        .on("mousemove", function() {
            var event = d3.event; // Again, use d3.event here
            tooltip.style("top", (event.pageY - 10) + "px")
                   .style("left", (event.pageX + 10) + "px");
        })
        .on("mouseout", function() {
            tooltip.style("visibility", "hidden");
        });
    }
</script>

</body>
<footer>
    <div id="footer"></div>
</footer>
</html>
